name: Publish UniChase to GitHub Pages
on:
  push:
    branches: [codex/production-readiness]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: UniChase/package-lock.json
      - run: npm ci
        working-directory: UniChase
      - run: npm run lint && npm test && npm run build
        working-directory: UniChase
        env:
          VITE_BASE_PATH: /UniChase/
          VITE_GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: UniChase/dist
      - uses: actions/deploy-pages@v4
        id: deployment
